services:
  kackaldi:
    image: ghcr.io/farukerata/bustracker:latest
    container_name: kackaldi
    restart: unless-stopped
    ports:
      - "127.0.0.1:5080:8080"
    volumes:
      - ./data:/data
    env_file: .env
    environment:
      TrustedProxyNetworks__0: "172.16.0.0/12"
    mem_limit: 384m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
