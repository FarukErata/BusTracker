services:
  kackaldi:
    image: ghcr.io/farukerata/bustracker:latest
    container_name: kackaldi
    restart: unless-stopped
    # Use the default docker0 bridge (gateway 172.17.0.1) so the container reaches the
    # relay tunnel and the ufw docker0 rule applies. A compose project network gets a
    # different gateway (e.g. 172.19.0.1) where the tunnel isn't listening, so the relay
    # would silently fall back to a direct call. See docs/relayed-connection.md.
    network_mode: bridge
    ports:
      - "127.0.0.1:5080:8080"
    volumes:
      - ./data:/data
    env_file: .env
    environment:
      TrustedProxyNetworks__0: "172.16.0.0/12"
    # Lets the container reach the Turkey relay tunnel bound on the Docker bridge gateway.
    # Set BusTracker__Ibb__Proxy=socks5://host.docker.internal:1080 in .env to use it; empty = direct.
    # See docs/relayed-connection.md.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 384m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
