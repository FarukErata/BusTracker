name: Server image
run-name: ${{ github.event_name == 'workflow_dispatch' && 'Server image (manual)' || 'Server image' }}

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "client/**"
      - "Dockerfile"
      - ".dockerignore"
      - "Directory.Build.props"
      - ".github/workflows/server-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: server-image
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/farukerata/bustracker
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: |
          short="${GITHUB_SHA::7}"
          echo "SHORT=$short" >> "$GITHUB_ENV"
          docker build --build-arg COMMIT="$short" -t "$IMAGE:latest" -t "$IMAGE:sha-$short" .

      - name: Smoke test
        run: |
          mkdir -p "$RUNNER_TEMP/data"
          sudo chown 1654:1654 "$RUNNER_TEMP/data"
          docker run -d --name smoke -p 8080:8080 -v "$RUNNER_TEMP/data:/data" \
            -e BusTracker__StaticData__SyncEnabled=false \
            -e BusTracker__Access__InviteCodes__0=smoke \
            "$IMAGE:latest"
          body=""
          for i in $(seq 1 30); do
            body=$(curl -sf http://127.0.0.1:8080/health) && break
            sleep 2
          done
          echo "$body"
          if ! echo "$body" | grep -q "\"commit\":\"$SHORT\""; then docker logs smoke; exit 1; fi
          if ! curl -sf http://127.0.0.1:8080/ | grep -q "<title>Kaç Kaldı</title>"; then docker logs smoke; exit 1; fi
          docker rm -f smoke

      - name: Publish
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:sha-$SHORT"
          docker push "$IMAGE:latest"
