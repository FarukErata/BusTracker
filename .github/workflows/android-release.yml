name: Android release
run-name: ${{ github.event_name == 'push' && format('Release {0}', github.ref_name) || inputs.action == 'publish' && 'Publish release' || format('Prepare release ({0} bump)', inputs.bump) }}

on:
  push:
    tags: ["android-v*"]
  workflow_dispatch:
    inputs:
      action:
        description: "prepare: build the APK and draft the release with suggested version and notes. publish: publish the draft."
        type: choice
        options: [prepare, publish]
        default: prepare
      bump:
        description: "Version bump for prepare (auto: minor if any Feature commit, otherwise patch)"
        type: choice
        options: [auto, patch, minor, major]
        default: auto

permissions:
  contents: write

concurrency:
  group: android-release

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'prepare'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Version and notes
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Prepare from main only, got $GITHUB_REF" >&2
            exit 1
          fi
          drafts=$(gh release list --json tagName,isDraft --jq '.[] | select(.isDraft and (.tagName | startswith("android-v"))) | .tagName')
          if [ -n "$drafts" ]; then
            echo "A draft already exists ($drafts). Publish it or delete it first." >&2
            exit 1
          fi
          name=$(bash .github/scripts/android-next-version.sh "$BUMP")
          bash .github/scripts/android-release-notes.sh HEAD "$GITHUB_REPOSITORY" "android-v$name" > "$RUNNER_TEMP/notes.md"
          printf '\n<!-- prepared-version: %s -->\n' "$name" >> "$RUNNER_TEMP/notes.md"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Build signed APK
        env:
          KEYSTORE_BASE64: ${{ secrets.BT_KEYSTORE_BASE64 }}
          BT_KEYSTORE_PASSWORD: ${{ secrets.BT_KEYSTORE_PASSWORD }}
        run: bash .github/scripts/android-build.sh "${{ steps.version.outputs.name }}"

      - name: Create draft release
        env:
          NAME: ${{ steps.version.outputs.name }}
        run: |
          gh release create "android-v$NAME" kackaldi.apk --draft --target "$(git rev-parse HEAD)" --title "Kaç Kaldı $NAME" --notes-file "$RUNNER_TEMP/notes.md"
          {
            echo "### Draft Kaç Kaldı $NAME is ready, with its APK"
            echo
            echo "Review or edit it on https://github.com/$GITHUB_REPOSITORY/releases, then run this workflow again with **publish**."
            echo "The version can be raised by renaming the tag (the APK is then rebuilt), but not lowered below $NAME."
            echo
            cat "$RUNNER_TEMP/notes.md"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    if: github.event_name == 'push' || inputs.action == 'publish'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Find release
        id: find
        run: |
          release="$RUNNER_TEMP/release.json"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            mode=tag
            tag="$GITHUB_REF_NAME"
            sha="$GITHUB_SHA"
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" > "$release" 2>/dev/null || echo '{}' > "$release"
          else
            drafts=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq '[.[] | select(.draft and (.tag_name | startswith("android-v")))]')
            count=$(echo "$drafts" | jq length)
            if [ "$count" != "1" ]; then
              echo "Expected exactly one Android draft release, found $count. Run prepare first." >&2
              exit 1
            fi
            echo "$drafts" | jq '.[0]' > "$release"
            mode=draft
            tag=$(jq -r '.tag_name' "$release")
            sha=$(jq -r '.target_commitish' "$release")
          fi
          jq -r '.body // ""' "$release" > "$RUNNER_TEMP/draft-notes.md"
          prepared=$(sed -n 's/.*<!-- prepared-version: \([0-9.]*\) -->.*/\1/p' "$RUNNER_TEMP/draft-notes.md" | head -1)
          apks=$(jq '[.assets[]? | select(.name == "kackaldi.apk")] | length' "$release")
          build=true
          if [ "$apks" != "0" ] && [ "${tag#android-v}" = "$prepared" ]; then build=false; fi
          {
            echo "mode=$mode"
            echo "tag=$tag"
            echo "sha=$sha"
            echo "prepared=$prepared"
            echo "exists=$(jq -r 'if .id then "true" else "false" end' "$release")"
            echo "build=$build"
          } >> "$GITHUB_OUTPUT"
          echo "Release $tag: prepared $prepared, APK attached: $apks, build: $build"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.find.outputs.sha }}
          fetch-depth: 0

      - name: Version
        id: version
        env:
          MODE: ${{ steps.find.outputs.mode }}
          TAG: ${{ steps.find.outputs.tag }}
          PREPARED: ${{ steps.find.outputs.prepared }}
        run: |
          name="${TAG#android-v}"
          if [ "$MODE" = "draft" ]; then
            minimum="$PREPARED"
            [ -z "$minimum" ] && minimum=$(bash .github/scripts/android-next-version.sh auto)
            bash .github/scripts/android-check-version.sh "$name" "$minimum"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v6
        if: steps.find.outputs.build == 'true'
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6
        if: steps.find.outputs.build == 'true'

      - name: Build signed APK
        if: steps.find.outputs.build == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.BT_KEYSTORE_BASE64 }}
          BT_KEYSTORE_PASSWORD: ${{ secrets.BT_KEYSTORE_PASSWORD }}
        run: bash .github/scripts/android-build.sh "${{ steps.version.outputs.name }}"

      - name: Publish release
        env:
          EXISTS: ${{ steps.find.outputs.exists }}
          BUILD: ${{ steps.find.outputs.build }}
          TAG: ${{ steps.find.outputs.tag }}
          NAME: ${{ steps.version.outputs.name }}
        run: |
          if [ "$EXISTS" = "true" ]; then
            sed '/<!-- prepared-version: /d' "$RUNNER_TEMP/draft-notes.md" > notes.md
            gh release edit "$TAG" --title "Kaç Kaldı $NAME" --notes-file notes.md
          else
            git fetch --force --quiet origin "refs/tags/$TAG:refs/tags/$TAG"
            bash .github/scripts/android-release-notes.sh "$TAG" "$GITHUB_REPOSITORY" "$TAG" > notes.md
            gh release create "$TAG" --draft --title "Kaç Kaldı $NAME" --notes-file notes.md
          fi
          cat notes.md
          if [ "$BUILD" = "true" ]; then gh release upload "$TAG" kackaldi.apk --clobber; fi
          gh release edit "$TAG" --draft=false --latest
