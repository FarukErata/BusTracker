name: Android release

on:
  push:
    tags: ["android-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Version from tag
        id: version
        run: |
          name="${GITHUB_REF_NAME#android-v}"
          if ! [[ "$name" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Tag must look like android-v1.2.3, got $GITHUB_REF_NAME" >&2
            exit 1
          fi
          code=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.BT_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed APK
        working-directory: android
        env:
          BT_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          BT_KEYSTORE_PASSWORD: ${{ secrets.BT_KEYSTORE_PASSWORD }}
          BT_KEY_ALIAS: bustracker
          BT_KEY_PASSWORD: ${{ secrets.BT_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease -PversionName=${{ steps.version.outputs.name }} -PversionCode=${{ steps.version.outputs.code }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk kackaldi.apk
          gh release create "$GITHUB_REF_NAME" --draft --title "Kaç Kaldı ${{ steps.version.outputs.name }}" --generate-notes
          gh release upload "$GITHUB_REF_NAME" kackaldi.apk
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
