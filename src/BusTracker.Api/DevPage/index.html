<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BusTracker dev</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --ok:#1a7f37; --terminal:#6e7781; --stale:#bf8700; --off:#cf222e; --alt:#8250df; --target:#0969da; --line:#d0d7de; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.4 system-ui, sans-serif; color:#1f2328; background:#fff; height:100vh; display:flex; flex-direction:column; }
  header { display:flex; gap:8px; align-items:center; padding:8px 12px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header input { width:90px; padding:6px 8px; font:inherit; text-transform:uppercase; }
  button { padding:6px 10px; font:inherit; cursor:pointer; border:1px solid var(--line); background:#f6f8fa; border-radius:6px; }
  button.active { background:var(--target); color:#fff; border-color:var(--target); }
  #status { margin-left:auto; color:#57606a; font-size:12px; }
  #status.stale { color:var(--stale); font-weight:600; }
  #status.error { color:var(--off); font-weight:600; }
  main { flex:1; display:grid; grid-template-columns:380px 1fr; min-height:0; }
  aside { overflow:auto; border-right:1px solid var(--line); }
  #map { height:100%; }
  #target { padding:10px 12px; border-bottom:1px solid var(--line); background:#f6f8fa; }
  #target h3 { margin:0 0 6px; font-size:14px; }
  #target .row { display:flex; justify-content:space-between; padding:2px 0; }
  .muted { color:#57606a; }
  ol { list-style:none; margin:0; padding:0; }
  li.stop { padding:6px 12px; border-bottom:1px solid #f0f2f4; cursor:pointer; display:flex; gap:8px; align-items:flex-start; }
  li.stop:hover { background:#f6f8fa; }
  li.stop.selected { background:#ddf4ff; }
  li.stop .seq { width:24px; color:#57606a; text-align:right; flex:none; }
  li.stop .name { flex:1; }
  .chips { display:flex; gap:4px; flex-wrap:wrap; margin-top:2px; }
  .chip { font-size:11px; padding:1px 6px; border-radius:10px; color:#fff; }
  .s-ok { background:var(--ok); } .s-at-terminal { background:var(--terminal); } .s-stale { background:var(--stale); }
  .s-off-route { background:var(--off); } .s-arrived { background:#24292f; } .s-no-route { background:var(--alt); }
  .alt { outline:2px dashed var(--alt); outline-offset:1px; }
  #target .eta { font-weight:600; }
  #board { padding:10px 12px; border-bottom:1px solid var(--line); }
  #board h3, #target h3 { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  #board .fav { display:flex; justify-content:space-between; gap:8px; padding:4px 0; cursor:pointer; }
  #board .fav:hover { background:#f6f8fa; }
  .x { border:none; background:none; color:#57606a; cursor:pointer; padding:0 4px; }
  footer { padding:8px 12px; font-size:12px; color:#57606a; border-top:1px solid var(--line); }
  .bus-icon { font-size:11px; font-weight:600; color:#fff; padding:2px 5px; border-radius:6px; white-space:nowrap; box-shadow:0 1px 3px #0005; }
  #legend { padding:8px 12px; font-size:12px; display:flex; gap:6px; flex-wrap:wrap; border-bottom:1px solid var(--line); }
  @media (max-width: 800px) { main { grid-template-columns:1fr; grid-template-rows:45vh 1fr; } aside { order:2; border-right:none; } }
</style>
</head>
<body>
<header>
  <strong>BusTracker dev</strong>
  <input id="line" placeholder="500T" maxlength="12">
  <button id="load">Load</button>
  <span id="dirs"></span>
  <button id="favLine" hidden title="Favorite this line in both directions">☆ line</button>
  <button id="favDir" hidden title="Favorite this line in the current direction only">☆ this direction</button>
  <button id="refresh" title="Server caches each line for 60 s">Refresh</button>
  <span id="status">Enter a line code</span>
</header>
<main>
  <aside>
    <div id="legend">
      <span class="chip s-ok">ok</span><span class="chip s-at-terminal">at terminal</span><span class="chip s-stale">stale</span>
      <span class="chip s-off-route">off route</span><span class="chip s-arrived">arrived</span><span class="chip s-ok alt">alternate route</span>
    </div>
    <div id="board"></div>
    <div id="target" hidden></div>
    <ol id="stops"></ol>
    <footer><span id="device"></span> <button id="link">Link another device</button> <span id="linkCode"></span></footer>
  </aside>
  <div id="map"></div>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const REFRESH_MS = 30000;
const state = { line: null, stops: null, shapes: [], direction: null, live: null, arrivals: null, targetCode: null, timer: null };
const $ = (id) => document.getElementById(id);

const map = L.map("map").setView([41.015, 28.979], 11);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap contributors" }).addTo(map);
const routeLayer = L.layerGroup().addTo(map);
const busLayer = L.layerGroup().addTo(map);
const variantLayer = L.layerGroup().addTo(map);
let pendingFit = null;

function fitRoute(bounds) {
  map.invalidateSize();
  const size = map.getSize();
  if (!size.x || !size.y) { pendingFit = bounds; return; }
  pendingFit = null;
  map.fitBounds(bounds, { padding: [20, 20], animate: false });
}

new ResizeObserver(() => { map.invalidateSize(); if (pendingFit) fitRoute(pendingFit); }).observe($("map"));

const save = () => { try { localStorage.setItem("bt-dev", JSON.stringify({ line: state.line, direction: state.direction, targetCode: state.targetCode })); } catch {} };
const restore = () => { try { return JSON.parse(localStorage.getItem("bt-dev")) ?? {}; } catch { return {}; } };

const KEY = "bt-key";
const getKey = () => { try { return localStorage.getItem(KEY); } catch { return null; } };
const setKey = (k) => { try { k ? localStorage.setItem(KEY, k) : localStorage.removeItem(KEY); } catch {} };

async function ensureDevice() {
  if (getKey()) return;
  const invite = new URLSearchParams(location.search).get("invite");
  const res = await fetch("/api/devices", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ platform: "web", name: "dev page", invite }) });
  const body = await res.json().catch(() => null);
  if (!res.ok) throw new Error(body?.detail ?? `Registration failed (HTTP ${res.status})`);
  setKey(body.key);
}

function requestHeaders(options) {
  return { ...(options.headers ?? {}), Authorization: `Bearer ${getKey()}`, ...(options.body ? { "Content-Type": "application/json" } : {}) };
}

async function readResponse(res) {
  if (res.status === 204) return null;
  const body = await res.json().catch(() => null);
  if (!res.ok) throw new Error(body?.detail ?? `HTTP ${res.status}`);
  return body;
}

async function api(path, options = {}, retried = false) {
  await ensureDevice();
  const res = await fetch(path, { ...options, headers: requestHeaders(options) });
  if (res.status === 401 && !retried) { setKey(null); return api(path, options, true); }
  return readResponse(res);
}

const post = (path, body) => api(path, { method: "POST", body: body ? JSON.stringify(body) : undefined });
const del = (path) => api(path, { method: "DELETE" });

function setStatus(text, kind = "") { const el = $("status"); el.textContent = text; el.className = kind; }

const currentStops = () => state.stops?.directions.find(d => d.direction === state.direction)?.stops ?? [];
const directionBuses = () => (state.live?.buses ?? []).filter(b => b.direction === state.direction);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

async function loadLine(code, saved = {}) {
  code = code.trim().toUpperCase();
  if (!code) return;
  setStatus(`Loading ${code}…`);
  try {
    state.stops = await api(`/api/lines/${encodeURIComponent(code)}/stops`);
  } catch (e) { setStatus(e.message, "error"); return; }
  state.line = state.stops.line;
  state.shapes = await api(`/api/lines/${encodeURIComponent(code)}/shapes?all=true`).then(r => r.shapes).catch(() => []);
  const dirs = state.stops.directions.map(d => d.direction);
  state.direction = dirs.includes(saved.direction) ? saved.direction : dirs[0];
  state.targetCode = saved.line === state.line ? saved.targetCode ?? null : null;
  $("line").value = state.line;
  renderDirections();
  renderRoute(true);
  await refreshLive();
  clearInterval(state.timer);
  state.timer = setInterval(refreshLive, REFRESH_MS);
  save();
}

async function refreshLive() {
  if (!state.line) return;
  try {
    state.live = await api(`/api/lines/${encodeURIComponent(state.line)}/live`);
    const d = state.live.data;
    const text = `${state.live.buses.length} buses · data ${d.ageSeconds}s old · fetched ${new Date(d.fetchedAt).toLocaleTimeString()}`;
    d.stale ? setStatus(`${text} · STALE (${d.staleReason})`, "stale") : setStatus(text);
  } catch (e) { setStatus(e.message, "error"); }
  await loadArrivals();
  renderAll();
}

async function loadFavorites() {
  try { state.favorites = await api("/api/favorites"); } catch (e) { state.favorites = { error: e.message, lines: [], stops: [] }; }
}

function favoriteStopRow(s) {
  return `<div class="fav" data-stop="${esc(s.favorite.stopCode)}">
      <span>🚏 ${esc(s.favorite.label ?? s.favorite.stopName)} <span class="muted">${esc(s.lines.join(", "))}</span></span>
      <button class="x" data-del-stop="${s.favorite.id}" title="Remove">✕</button></div>`;
}

function favoriteLineRow(l) {
  const dir = l.favorite.direction ? l.directions[l.favorite.direction] ?? l.favorite.direction : "both directions";
  return `<div class="fav" data-line="${esc(l.favorite.lineCode)}" data-dir="${esc(l.favorite.direction ?? "")}">
      <span>🚌 <b>${esc(l.favorite.lineCode)}</b> <span class="muted">${esc(dir)}</span></span>
      <button class="x" data-del-line="${l.favorite.id}" title="Remove">✕</button></div>`;
}

function bindBoard(el) {
  for (const row of el.querySelectorAll(".fav[data-stop]")) row.onclick = () => openStop(row.dataset.stop);
  for (const row of el.querySelectorAll(".fav[data-line]")) row.onclick = () => loadLine(row.dataset.line, { line: row.dataset.line, direction: row.dataset.dir || undefined });
  for (const x of el.querySelectorAll("[data-del-stop]")) x.onclick = (e) => { e.stopPropagation(); removeFavorite(`/api/favorites/stops/${x.dataset.delStop}`); };
  for (const x of el.querySelectorAll("[data-del-line]")) x.onclick = (e) => { e.stopPropagation(); removeFavorite(`/api/favorites/lines/${x.dataset.delLine}`); };
  $("stopSearch").oninput = debounce(searchStops, 300);
}

function renderBoard() {
  const el = $("board");
  const f = state.favorites;
  if (!f) { el.innerHTML = ""; return; }
  const items = f.stops.map(favoriteStopRow).join("") + f.lines.map(favoriteLineRow).join("");
  el.innerHTML = `<h3>Favorites</h3>
    <input id="stopSearch" placeholder="Search stop…" style="width:100%;padding:6px;margin-bottom:6px">
    <div id="searchResults"></div>
    ${items || muted("No favorites yet.")}
    <div id="stopPanel"></div>`;
  bindBoard(el);
  renderFavLineButtons();
  if (state.openStop) renderStopPanel();
}

const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

async function searchStops(e) {
  const q = e.target.value.trim();
  const box = $("searchResults");
  if (q.length < 2) { box.innerHTML = ""; return; }
  const results = await api(`/api/stops?q=${encodeURIComponent(q)}`).catch(() => []);
  box.innerHTML = results.map(r => `<div class="fav" data-stop="${esc(r.stop.code)}"><span>${esc(r.stop.name)} <span class="muted">${esc(r.stop.district)} · ${esc(r.lines.join(", "))}</span></span></div>`).join("")
    || `<div class="muted">No stop found.</div>`;
  for (const row of box.querySelectorAll(".fav")) row.onclick = () => openStop(row.dataset.stop);
}

async function openStop(code) {
  state.openStop = { code, data: null };
  renderStopPanel();
  try { state.openStop.data = await api(`/api/stops/${encodeURIComponent(code)}/arrivals`); }
  catch (e) { state.openStop.data = { error: e.message }; }
  renderStopPanel();
}

const muted = (text) => `<div class="muted">${esc(text)}</div>`;
const isStopSaved = (code) => !!state.favorites?.stops.some(s => s.favorite.stopCode === code);

function stopHeader(title, code, buttonId) {
  const action = isStopSaved(code) ? "<span class=muted>★ saved</span>" : `<button id=${buttonId}>☆ save stop</button>`;
  return `<h3><span>${title}</span>${action}</h3>`;
}

function stopArrivalRow(a) {
  const when = a.bus.notDeparted ? "waiting at first stop" : `${a.bus.stopsAway} stops · <span class="eta">${mins(a.bus.etaSeconds)}</span>`;
  return `<div class="row"><span><b>${esc(a.line)}</b> <span class="muted">→ ${esc(a.directionName)}</span></span><span>${when}</span></div>`;
}

function stopPanelHtml(d) {
  const rows = d.arrivals.slice(0, 8).map(stopArrivalRow).join("");
  const missing = d.lines.filter(l => l.error).map(l => l.line);
  return stopHeader(`🚏 ${esc(d.stop.name)}`, d.stop.code, "saveOpenStop")
    + (rows || muted("No bus approaching."))
    + (missing.length ? muted(`No data yet: ${missing.join(", ")}`) : "");
}

function renderStopPanel() {
  const el = $("stopPanel");
  if (!el || !state.openStop) return;
  const d = state.openStop.data;
  if (!d) { el.innerHTML = muted("Loading stop…"); return; }
  el.innerHTML = d.error ? muted(d.error) : stopPanelHtml(d);
  $("saveOpenStop")?.addEventListener("click", () => saveStop(d.stop.code));
}

function renderFavLineButtons() {
  const btn = $("favLine");
  btn.hidden = !state.line;
  const both = state.favorites?.lines.find(l => l.favorite.lineCode === state.line && !l.favorite.direction);
  const oneWay = state.favorites?.lines.find(l => l.favorite.lineCode === state.line && l.favorite.direction === state.direction);
  btn.textContent = both ? "★ line" : "☆ line";
  btn.onclick = () => toggleLineFavorite(both, null);
  const dirBtn = $("favDir");
  dirBtn.hidden = !state.line;
  dirBtn.textContent = oneWay ? "★ this direction" : "☆ this direction";
  dirBtn.onclick = () => toggleLineFavorite(oneWay, state.direction);
}

async function toggleLineFavorite(existing, direction) {
  try { existing ? await del(`/api/favorites/lines/${existing.favorite.id}`) : await post("/api/favorites/lines", { line: state.line, direction }); }
  catch (e) { setStatus(e.message, "error"); }
  await loadFavorites(); renderBoard(); renderAll();
}

async function removeFavorite(path) {
  try { await del(path); } catch (e) { setStatus(e.message, "error"); }
  await loadFavorites(); renderBoard(); renderAll();
}

async function saveStop(code) {
  try { await post("/api/favorites/stops", { stop: code }); } catch (e) { setStatus(e.message, "error"); }
  await loadFavorites(); renderBoard(); renderAll();
}

async function showDevice() {
  try {
    const me = await api("/api/me");
    $("device").textContent = `device #${me.currentDeviceId} · ${me.devices.length} device${me.devices.length === 1 ? "" : "s"} on this user`;
  } catch (e) { $("device").textContent = e.message; }
}

async function loadArrivals() {
  state.arrivals = null;
  if (!state.line || !state.targetCode) return;
  try {
    state.arrivals = await api(`/api/lines/${encodeURIComponent(state.line)}/arrivals?stop=${encodeURIComponent(state.targetCode)}&dir=${state.direction}`);
  } catch (e) { state.arrivals = { error: e.message }; }
}

const directionLabel = (d) => `${d.stops[0]?.name ?? "?"} → ${d.stops.at(-1)?.name ?? d.name}`;
const directionTitle = (d) => `${d.direction === "G" ? "Gidiş" : d.direction === "D" ? "Dönüş" : d.direction} (${d.direction})`;

function renderDirections() {
  const dirs = state.stops.directions;
  const current = dirs.find(d => d.direction === state.direction) ?? dirs[0];
  const b = document.createElement("button");
  b.className = "active";
  b.textContent = dirs.length > 1 ? `${directionLabel(current)}  ⇄` : directionLabel(current);
  b.title = dirs.length > 1 ? `${directionTitle(current)} · click to reverse` : directionTitle(current);
  b.disabled = dirs.length < 2;
  b.onclick = toggleDirection;
  $("dirs").replaceChildren(b);
}

function toggleDirection() {
  const dirs = state.stops.directions;
  const i = dirs.findIndex(d => d.direction === state.direction);
  state.direction = dirs[(i + 1) % dirs.length].direction;
  state.targetCode = null;
  state.arrivals = null;
  renderDirections(); renderRoute(true); renderAll(); save();
}

function renderRoute(fit) {
  routeLayer.clearLayers();
  const stops = currentStops();
  if (!stops.length) return;
  variantLayer.clearLayers();
  const shape = state.shapes.find(x => x.direction === state.direction && x.variant === "D0");
  const line = shape
    ? L.polyline(shape.points, { color: "#0969da", weight: 4, opacity: 0.6 }).addTo(routeLayer)
    : L.polyline(stops.map(s => [s.lat, s.lng]), { color: "#cf222e", weight: 2, opacity: 0.5, dashArray: "4 6" })
        .bindTooltip("No route geometry imported yet, so this joins stops with straight lines").addTo(routeLayer);
  for (const s of stops) {
    const isTarget = s.code === state.targetCode;
    L.circleMarker([s.lat, s.lng], { radius: isTarget ? 9 : 4, color: isTarget ? "#0969da" : "#57606a", fillOpacity: isTarget ? 0.9 : 0.6, weight: isTarget ? 3 : 1 })
      .bindTooltip(`${s.seq}. ${esc(s.name)}`).on("click", () => selectTarget(s.code)).addTo(routeLayer);
  }
  if (fit) fitRoute(line.getBounds());
}

function renderAll() { renderBuses(); renderStops(); renderTarget(); if (state.favorites) renderFavLineButtons(); }

function renderBuses() {
  busLayer.clearLayers();
  const bySeq = new Map(currentStops().map(st => [st.seq, st]));
  for (const b of directionBuses()) {
    const last = bySeq.get(b.lastStopSeq), next = bySeq.get(b.nextStopSeq);
    const icon = L.divIcon({ className: "", html: `<span class="bus-icon s-${b.status}${b.variant !== "D0" ? " alt" : ""}">${esc(b.doorNo)}</span>`, iconAnchor: [20, 10] });
    L.marker([b.lat, b.lng], { icon }).bindPopup(
      `<b>${esc(b.doorNo)}</b> · ${esc(b.routeCode)}${b.onOwnVariant ? "" : " <i>(drawn on main route)</i>"}<br>→ ${esc(b.destination)}<br>` +
      `${last ? `after ${last.seq}. ${esc(last.name)}` : "before first stop"}${next ? ` → ${next.seq}. ${esc(next.name)} (${Math.round((b.progressToNext ?? 0) * 100)}%)` : ""}<br>` +
      `${km(b.alongMeters)} of ${km(b.routeLengthMeters)} · ${b.offsetMeters} m off road<br>` +
      `speed ${b.speedKmh ?? "?"} km/h · status ${b.status} · GPS ${b.ageSeconds}s old`)
      .on("popupopen", () => showVariant(b.routeCode)).on("popupclose", () => variantLayer.clearLayers()).addTo(busLayer);
  }
}

const km = (m) => m == null ? "?" : `${(m / 1000).toFixed(1)} km`;
const mins = (s) => s == null ? null : s < 60 ? "< 1 min" : `≈ ${Math.round(s / 60)} min`;

function showVariant(routeCode) {
  variantLayer.clearLayers();
  const shape = state.shapes.find(x => x.routeCode === routeCode);
  if (shape && shape.variant !== "D0") L.polyline(shape.points, { color: "#8250df", weight: 4, opacity: 0.8, dashArray: "8 6" }).addTo(variantLayer);
}

function renderStops() {
  const bySeq = new Map();
  for (const b of directionBuses()) if (b.lastStopSeq != null) (bySeq.get(b.lastStopSeq) ?? bySeq.set(b.lastStopSeq, []).get(b.lastStopSeq)).push(b);
  $("stops").innerHTML = currentStops().map(s => {
    const chips = (bySeq.get(s.seq) ?? []).map(b =>
      `<span class="chip s-${b.status}${b.variant !== "D0" ? " alt" : ""}" title="${esc(b.routeCode)} · ${Math.round((b.progressToNext ?? 0) * 100)}% to next stop">${esc(b.doorNo)} ↓</span>`).join("");
    return `<li class="stop${s.code === state.targetCode ? " selected" : ""}" data-code="${esc(s.code)}">
      <span class="seq">${s.seq}</span><span class="name">${esc(s.name)} <span class="muted">${esc(s.district)}</span>${chips ? `<div class="chips">${chips}</div>` : ""}</span></li>`;
  }).join("");
  for (const li of $("stops").children) li.onclick = () => selectTarget(li.dataset.code);
}

const busChip = (x) => `<span class="chip s-${x.notDeparted ? "at-terminal" : "ok"}${x.variant !== "D0" ? " alt" : ""}" title="${esc(x.routeCode)}">${esc(x.doorNo)}</span>`;

function approachingRow(x) {
  const waiting = x.notDeparted ? "<span class=muted>waiting at first stop</span>" : "";
  const where = x.stopsAway === 0 ? "at your stop" : `${x.stopsAway} stops · ${km(x.distanceMeters)}`;
  const eta = x.etaSeconds != null ? `<span class="eta">${mins(x.etaSeconds)}</span>` : "";
  return `<div class="row"><span>${busChip(x)} ${waiting}</span><span>${where} ${eta}</span></div>`;
}

const passedRow = (x) => `<div class="row"><span>${busChip(x)}</span><span class="muted">passed, ${km(x.metersPast)} ago</span></div>`;

function targetHtml(a) {
  const coming = a.approaching.map(approachingRow).join("");
  const passed = a.recentlyPassed.slice(0, 3).map(passedRow).join("");
  return stopHeader(`${a.stop.seq}. ${esc(a.stop.name)}`, a.stop.code, "saveStop")
    + (coming || muted("No bus approaching in this direction."))
    + (passed ? `<div class="muted" style="margin-top:6px">Recently passed</div>${passed}` : "");
}

function renderTarget() {
  const el = $("target");
  const a = state.arrivals;
  el.hidden = !state.targetCode || !a;
  if (el.hidden) return;
  el.innerHTML = a.error ? muted(a.error) : targetHtml(a);
  $("saveStop")?.addEventListener("click", () => saveStop(a.stop.code));
}

async function selectTarget(code) {
  state.targetCode = state.targetCode === code ? null : code;
  renderRoute(false); save();
  await loadArrivals();
  renderAll();
}

$("load").onclick = () => loadLine($("line").value);
$("line").onkeydown = (e) => { if (e.key === "Enter") loadLine($("line").value); };
$("refresh").onclick = refreshLive;

$("link").onclick = async () => {
  try { const c = await post("/api/me/link-codes"); $("linkCode").textContent = `code ${c.code}, valid until ${new Date(c.expiresAt).toLocaleTimeString()}`; }
  catch (e) { $("linkCode").textContent = e.message; }
};

(async () => {
  await showDevice();
  await loadFavorites();
  renderBoard();
  const saved = restore();
  if (saved.line) loadLine(saved.line, saved);
})();
</script>
</body>
</html>
